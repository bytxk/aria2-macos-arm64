name: Build aria2 macOS ARM64 Static

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

      # Build/install prefix for all third-party static libraries.
      PREFIX: ${{ github.workspace }}/_static

      # Versions kept close to the previously proven makerelease-osx.mk toolchain.
      ZLIB_VERSION: "1.2.11"
      EXPAT_VERSION: "2.2.8"
      CARES_VERSION: "1.15.0"
      SQLITE_VERSION: "3300000"
      GMP_VERSION: "6.1.2"
      LIBGPG_ERROR_VERSION: "1.36"
      LIBGCRYPT_VERSION: "1.8.5"
      LIBSSH2_VERSION: "1.9.0"

      # SHA-256 values from the previously used makerelease-osx.mk.
      ZLIB_SHA256: "c3e5e9fdd5004dcb542feda5ee4f0ff0744628baf8ed2dd5d66f8ca1197cb1a1"
      EXPAT_SHA256: "bd507cba42716ca9afe46dd3687fb0d46c09347517beb9770f53a435d2c67ea0"
      CARES_SHA256: "6cdb97871f2930530c97deb7cf5c8fa4be5a0b02c7cea6e7c7667672a39d6852"
      SQLITE_SHA256: "e0a8cf4c7a87455e55e10413d16f358ca121ccec687fe1301eac95e2d340fc58"
      GMP_SHA256: "5275bb04f4863a13516b2f39392ac5e272f5e1bb8057b18aec1c9b79d73d8fb2"
      LIBGPG_ERROR_SHA256: "babd98437208c163175c29453f8681094bcaf92968a15cafb1a276076b33c97c"
      LIBGCRYPT_SHA256: "3b4a2a94cb637eff5bdebbcaf46f4d95c4f25206f459809339cdada0eb577ac3"
      LIBSSH2_SHA256: "d5fb8bd563305fd1074dda90bd053fb2d29fc4bce048d182f96eaa466dfadafd"

    steps:
      - name: Checkout aria2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify runner
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Host ====="
          uname -a
          uname -m
          sw_vers
          clang --version

          test "$(uname -m)" = "arm64"

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          # Homebrew is used ONLY for build tools, never for runtime libraries.
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext

      - name: Prepare directories and flags
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PREFIX"
          mkdir -p "$RUNNER_TEMP/aria2-deps"

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

          echo "BASE_CFLAGS=-Os -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -arch arm64" >> "$GITHUB_ENV"
          echo "BASE_CXXFLAGS=-Os -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -arch arm64 -stdlib=libc++ -std=c++11" >> "$GITHUB_ENV"
          echo "BASE_LDFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -arch arm64 -Wl,-dead_strip" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # zlib
      # ----------------------------------------------------------------------
      - name: Build static zlib
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz" \
            --output zlib.tar.gz

          echo "${ZLIB_SHA256}  zlib.tar.gz" | shasum -a 256 -c -

          tar -xzf zlib.tar.gz
          cd "zlib-${ZLIB_VERSION}"

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
            ./configure \
              --static \
              --prefix="$PREFIX"

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # Expat
      # ----------------------------------------------------------------------
      - name: Build static Expat
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://github.com/libexpat/libexpat/releases/download/R_2_2_8/expat-${EXPAT_VERSION}.tar.gz" \
            --output expat.tar.gz

          echo "${EXPAT_SHA256}  expat.tar.gz" | shasum -a 256 -c -

          tar -xzf expat.tar.gz
          mkdir -p expat-build
          cd expat-build

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
          LDFLAGS="${BASE_LDFLAGS} -flto" \
            "../expat-${EXPAT_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared \
              --without-docbook

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # c-ares
      # ----------------------------------------------------------------------
      - name: Build static c-ares
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://c-ares.org/download/c-ares-${CARES_VERSION}.tar.gz" \
            --output cares.tar.gz

          echo "${CARES_SHA256}  cares.tar.gz" | shasum -a 256 -c -

          tar -xzf cares.tar.gz
          mkdir -p cares-build
          cd cares-build

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
          LDFLAGS="${BASE_LDFLAGS} -flto" \
            "../c-ares-${CARES_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # SQLite
      # ----------------------------------------------------------------------
      - name: Build static SQLite
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://www.sqlite.org/2019/sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            --output sqlite.tar.gz

          echo "${SQLITE_SHA256}  sqlite.tar.gz" | shasum -a 256 -c -

          tar -xzf sqlite.tar.gz
          mkdir -p sqlite-build
          cd sqlite-build

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
          LDFLAGS="${BASE_LDFLAGS} -flto" \
            "../sqlite-autoconf-${SQLITE_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ----------------------------------------------------------------------
      # GMP
      # ----------------------------------------------------------------------
      - name: Build static GMP
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.bz2" \
            --output gmp.tar.bz2

          echo "${GMP_SHA256}  gmp.tar.bz2" | shasum -a 256 -c -

          tar -xjf gmp.tar.bz2
          mkdir -p gmp-build
          cd gmp-build

          CFLAGS="${BASE_CFLAGS}" \
          CXXFLAGS="${BASE_CXXFLAGS}" \
          LDFLAGS="${BASE_LDFLAGS}" \
            "../gmp-${GMP_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared \
              --disable-cxx \
              --with-pic

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # libgpg-error
      # ----------------------------------------------------------------------
      - name: Build static libgpg-error
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-${LIBGPG_ERROR_VERSION}.tar.bz2" \
            --output libgpg-error.tar.bz2

          echo "${LIBGPG_ERROR_SHA256}  libgpg-error.tar.bz2" | shasum -a 256 -c -

          tar -xjf libgpg-error.tar.bz2
          mkdir -p libgpg-error-build
          cd libgpg-error-build

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
          LDFLAGS="${BASE_LDFLAGS} -flto" \
            "../libgpg-error-${LIBGPG_ERROR_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared \
              --with-pic \
              --disable-languages \
              --disable-doc \
              --disable-nls

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # libgcrypt
      # ----------------------------------------------------------------------
      - name: Build static libgcrypt
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-${LIBGCRYPT_VERSION}.tar.bz2" \
            --output libgcrypt.tar.bz2

          echo "${LIBGCRYPT_SHA256}  libgcrypt.tar.bz2" | shasum -a 256 -c -

          tar -xjf libgcrypt.tar.bz2
          mkdir -p libgcrypt-build
          cd libgcrypt-build

          CFLAGS="${BASE_CFLAGS}" \
          CXXFLAGS="${BASE_CXXFLAGS}" \
          LDFLAGS="${BASE_LDFLAGS}" \
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
            "../libgcrypt-${LIBGCRYPT_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared \
              --with-gpg-error-prefix="$PREFIX" \
              --disable-O-flag-munging \
              --disable-asm \
              --disable-amd64-as-feature-detection

          make -j"$(sysctl -n hw.logicalcpu)"
          make check
          make install

      # ----------------------------------------------------------------------
      # libssh2
      # ----------------------------------------------------------------------
      - name: Build static libssh2 with libgcrypt
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/aria2-deps"

          curl --fail --location --retry 3 \
            "https://www.libssh2.org/download/libssh2-${LIBSSH2_VERSION}.tar.gz" \
            --output libssh2.tar.gz

          echo "${LIBSSH2_SHA256}  libssh2.tar.gz" | shasum -a 256 -c -

          tar -xzf libssh2.tar.gz
          mkdir -p libssh2-build
          cd libssh2-build

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections" \
          CXXFLAGS="${BASE_CXXFLAGS} -flto -ffunction-sections -fdata-sections" \
          LDFLAGS="${BASE_LDFLAGS} -flto" \
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
            "../libssh2-${LIBSSH2_VERSION}/configure" \
              --prefix="$PREFIX" \
              --enable-static \
              --disable-shared \
              --with-pic \
              --without-openssl \
              --with-libgcrypt="$PREFIX" \
              --with-libgcrypt-prefix="$PREFIX"

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ----------------------------------------------------------------------
      # aria2
      # ----------------------------------------------------------------------
      - name: Generate aria2 configure
        shell: bash
        run: |
          set -euxo pipefail

          autoreconf -i

      - name: Configure aria2
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build-arm64
          mkdir build-arm64
          cd build-arm64

          CFLAGS="${BASE_CFLAGS} -flto -ffunction-sections -fdata-sections -I${PREFIX}/include" \
          CXXFLAGS="${BASE_CXXFLAGS} -flto -ffunction-sections -fdata-sections -I${PREFIX}/include" \
          LDFLAGS="${BASE_LDFLAGS} -flto -L${PREFIX}/lib" \
          PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig" \
            ../configure \
              --prefix="$GITHUB_WORKSPACE/dist" \
              --sysconfdir=/etc \
              --enable-static \
              --disable-shared \
              --enable-metalink \
              --enable-bittorrent \
              --disable-nls \
              --with-appletls \
              --with-libgmp \
              --with-sqlite3 \
              --with-libz \
              --with-libexpat \
              --with-libcares \
              --with-libgcrypt \
              --with-libssh2 \
              --without-libuv \
              --without-gnutls \
              --without-openssl \
              --without-libnettle \
              --without-libxml2 \
              ARIA2_STATIC=yes

      - name: Build aria2
        shell: bash
        run: |
          set -euxo pipefail
          cd build-arm64

          make -j"$(sysctl -n hw.logicalcpu)"

          # Run aria2's test suite if it is available in this configuration.
          make check || {
            echo "::warning::aria2 make check failed or tests were unavailable; continuing to binary verification."
          }

          make install-strip

      # ----------------------------------------------------------------------
      # Verification
      # ----------------------------------------------------------------------
      - name: Verify final binary
        shell: bash
        run: |
          set -euxo pipefail

          BIN="$GITHUB_WORKSPACE/dist/bin/aria2c"

          echo "===== Architecture ====="
          file "$BIN"
          lipo -archs "$BIN"
          test "$(lipo -archs "$BIN")" = "arm64"

          echo
          echo "===== aria2 version / Enabled Features ====="
          "$BIN" --version

          echo
          echo "===== Mach-O dynamic dependencies ====="
          otool -L "$BIN"

          echo
          echo "===== PIE ====="
          otool -hv "$BIN" | grep PIE

          echo
          echo "===== Homebrew runtime dependency check ====="
          if otool -L "$BIN" | grep -E '/opt/homebrew|/usr/local/Cellar|/usr/local/opt'; then
            echo "ERROR: Homebrew runtime dependency detected."
            exit 1
          fi

          echo "OK: no Homebrew runtime dependencies."

          echo
          echo "===== Expected feature check ====="
          FEATURES="$("$BIN" --version | sed -n '/Enabled Features:/,$p')"
          echo "$FEATURES"

          for feature in \
            "Async DNS" \
            "BitTorrent" \
            "Firefox3 Cookie" \
            "GZip" \
            "HTTPS" \
            "Message Digest" \
            "Metalink" \
            "XML-RPC" \
            "SFTP"
          do
            echo "$FEATURES" | grep -Fq "$feature" || {
              echo "ERROR: missing expected feature: $feature"
              exit 1
            }
          done

      # ----------------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------------
      - name: Package portable archive
        shell: bash
        run: |
          set -euxo pipefail

          BIN="$GITHUB_WORKSPACE/dist/bin/aria2c"
          VERSION="$("$BIN" --version | head -n1 | awk '{print $3}')"
          PACKAGE="aria2-${VERSION}-macos-arm64"

          rm -rf package artifact
          mkdir -p "package/$PACKAGE" artifact

          cp "$BIN" "package/$PACKAGE/aria2c"
          cp COPYING "package/$PACKAGE/LICENSE" || true

          {
            echo "aria2 ${VERSION} for macOS Apple Silicon"
            echo
            echo "Architecture: arm64"
            echo "Minimum deployment target: macOS ${MACOSX_DEPLOYMENT_TARGET}"
            echo "Runtime Homebrew dependency: none"
            echo
            echo "Enabled features:"
            "$BIN" --version | sed -n '/Enabled Features:/,$p'
          } > "package/$PACKAGE/BUILD-INFO.txt"

          tar -C package -czf "artifact/${PACKAGE}.tar.gz" "$PACKAGE"

          shasum -a 256 "artifact/${PACKAGE}.tar.gz" \
            > "artifact/${PACKAGE}.tar.gz.sha256"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            artifact/*.tar.gz
            artifact/*.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/*.tar.gz
            artifact/*.sha256
