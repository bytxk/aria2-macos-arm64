name: Build aria2 macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check environment
        run: |
          uname -a
          uname -m
          clang --version

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config gettext

      - name: Download aria2
        run: |
          git clone --depth 1 https://github.com/aria2/aria2.git
          cd aria2
          git submodule update --init --recursive

      - name: Prepare static prefix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/static"
          echo "PREFIX=$GITHUB_WORKSPACE/static" >> "$GITHUB_ENV"

      # ==============================
      # zlib
      # ==============================

      - name: Build zlib
        run: |
          curl -L \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz \
            -o zlib.tar.gz

          tar xf zlib.tar.gz
          cd zlib-1.3.1

          ./configure \
            --static \
            --prefix="$PREFIX"

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ==============================
      # OpenSSL
      # ==============================

      - name: Build OpenSSL
        run: |
          curl -L \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.2/openssl-3.5.2.tar.gz \
            -o openssl.tar.gz

          tar xf openssl.tar.gz
          cd openssl-3.5.2

          ./Configure darwin64-arm64-cc \
            no-shared \
            no-tests \
            --prefix="$PREFIX" \
            --openssldir="$PREFIX/ssl"

          make -j"$(sysctl -n hw.logicalcpu)"
          make install_sw

      # ==============================
      # c-ares
      # ==============================

      - name: Build c-ares
        run: |
          curl -L \
            https://github.com/c-ares/c-ares/releases/download/v1.34.5/c-ares-1.34.5.tar.gz \
            -o cares.tar.gz

          tar xf cares.tar.gz
          cd c-ares-1.34.5

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ==============================
      # libssh2
      # ==============================

      - name: Build libssh2
        run: |
          curl -L \
            https://www.libssh2.org/download/libssh2-1.11.1.tar.gz \
            -o libssh2.tar.gz

          tar xf libssh2.tar.gz
          cd libssh2-1.11.1

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --with-crypto=openssl

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ==============================
      # expat
      # ==============================

      - name: Build expat
        run: |
          curl -L \
            https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.gz \
            -o expat.tar.gz

          tar xf expat.tar.gz
          cd expat-2.7.1

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --without-docbook \
            --without-examples \
            --without-tests

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ==============================
      # sqlite
      # ==============================

      - name: Build SQLite
        run: |
          curl -L \
            https://www.sqlite.org/2025/sqlite-autoconf-3500400.tar.gz \
            -o sqlite.tar.gz

          tar xf sqlite.tar.gz
          cd sqlite-autoconf-3500400

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      # ==============================
      # aria2
      # ==============================

      - name: Build aria2
        working-directory: aria2
        run: |
          autoreconf -i

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          ./configure \
            ARIA2_STATIC=yes \
            --with-openssl \
            --with-libcares \
            --with-libssh2 \
            --with-libexpat \
            --with-sqlite3 \
            --without-gnutls

          make -j"$(sysctl -n hw.logicalcpu)"

      # ==============================
      # Verify
      # ==============================

      - name: Verify binary
        run: |
          echo "===== Architecture ====="
          file aria2/src/aria2c
          lipo -archs aria2/src/aria2c

          echo
          echo "===== Dependencies ====="
          otool -L aria2/src/aria2c

          echo
          echo "===== Version ====="
          aria2/src/aria2c --version

          if otool -L aria2/src/aria2c | \
             grep -E "/opt/homebrew|/usr/local/Cellar|/usr/local/opt"; then

            echo "ERROR: Homebrew dependency detected"
            exit 1
          fi

          echo "No Homebrew runtime dependencies."

      # ==============================
      # Package
      # ==============================

      - name: Package
        run: |
          VERSION="$(aria2/src/aria2c --version | head -1 | awk '{print $3}')"

          PACKAGE="aria2-${VERSION}-macos-arm64"

          mkdir "$PACKAGE"

          cp aria2/src/aria2c "$PACKAGE/"

          cat > "$PACKAGE/README.txt" <<EOF
          aria2 for macOS Apple Silicon

          Architecture:
          arm64

          Compatible with:
          Apple M1
          Apple M2
          Apple M3
          Apple M4
          and newer Apple Silicon

          Minimum deployment target:
          macOS 11

          No Homebrew installation required.

          Run:

          ./aria2c --version
          EOF

          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

          shasum -a 256 "$PACKAGE.tar.gz" \
            > "$PACKAGE.tar.gz.sha256"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256
